name: Deploy to VPS

# NOTA: el disparo automático por push está DESACTIVADO porque el firewall del
# VPS bloquea el SSH entrante desde GitHub (puerto 22 filtrado). Para reactivarlo,
# habría que permitir SSH desde internet (con endurecimiento) y volver a agregar
# el trigger `push:`. Mientras tanto, se despliega a mano por Termius.
# Igual se puede disparar manualmente desde la pestaña "Actions" → Run workflow
# (solo funcionará si el firewall permite el acceso de GitHub).
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # Usá UNO de los dos: SSH_KEY (clave privada) o SSH_PASSWORD.
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            cd /root/Sueldos_UY_2026.1
            git fetch origin claude/uruguayan-payroll-system-EojHu
            git checkout claude/uruguayan-payroll-system-EojHu
            git reset --hard origin/claude/uruguayan-payroll-system-EojHu
            docker compose up -d --build
            # Esperar a que el backend esté arriba y aplicar migraciones (aditivas).
            sleep 8
            docker compose exec -T backend npm run prisma:migrate
            echo "Deploy OK: $(git log -1 --oneline)"
