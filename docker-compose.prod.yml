# Overlay de PRODUCCIÓN. Se combina con docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Mantiene la base intacta entre deploys (mismo volumen postgres_data) y fuerza
# políticas de reinicio. El hardening del puerto de la BD se documenta en
# docs/DEPLOY.md (no se publica 5432 hacia afuera en prod).
services:
  postgres:
    restart: always

  backend:
    restart: always
    environment:
      NODE_ENV: production

  frontend:
    restart: always
