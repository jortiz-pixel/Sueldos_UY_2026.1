server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Permite subir archivos (foto, scans, PDF). El límite real lo impone multer (5MB).
    client_max_body_size 10m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # React SPA routing. El index.html NUNCA se cachea (siempre revalida): así,
    # al desplegar una versión nueva, el navegador toma el index.html actual —
    # que referencia los assets con hash nuevos— en vez de quedar pegado al JS
    # viejo (los assets con hash sí se cachean 'immutable', ver abajo). Sin esto
    # el navegador puede seguir sirviendo la UI anterior tras un deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # El index.html servido directamente (o por el fallback del SPA) tampoco se
    # cachea.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
